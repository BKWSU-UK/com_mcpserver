name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Build release package
        run: ./build.sh

      - name: Resolve version
        id: version
        run: |
          VERSION="$(grep -oP '<version>\K[^<]+' mcpserver.xml)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package=com_mcpserver-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No changelog section found for version ${VERSION}." > release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: MCP Server for Joomla v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.version.outputs.package }}
          generate_release_notes: false

      - name: Record package checksum in update feed
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          # The published artifact is the one built above; hash it and write the
          # checksum into update.xml on master (the feed Joomla actually reads),
          # so clients no longer warn about a missing integrity checksum.
          SHA256="$(sha256sum "$PACKAGE" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master
          python3 scripts/sync_update_entry.py update.xml "$VERSION" "$SHA256"
          if git diff --quiet -- update.xml; then
            echo "update.xml already current for v${VERSION}"
          else
            git add update.xml
            git commit -m "Add SHA-256 checksum for v${VERSION} to update feed"
            git push origin master
          fi
